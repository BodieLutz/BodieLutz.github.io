<!-- Contact -->
<section id="contact">
  <div class="section-container">
    <h2>Get In Contact with Me!</h2>
    <h4>Let's connect! Send me a message if you're interested.</h4>
    <div class="parent">
      <div class="contact-card">
        <i class="bi bi-envelope contact-card-icon"></i>
        <h5>Email</h5>
        <p>Email is my preferred method of contact. Drop me a line!</p>
        <div id="email-btn-div">
          <button onclick="window.location.href='mailto:bodielutz@gmail.com';">Email Me</button>
        </div>
      </div>
      <div class="contact-card">
        <i class="bi bi-linkedin contact-card-icon"></i>
        <h5>LinkedIn</h5>
        <p>Send me a message or connect with me on LinkedIn!</p>
        <div id="linkedin-btn-div">
          <a href="https://www.linkedin.com/in/bodie-lutz-40ab78293/" target="_blank">
            <button>View my LinkedIn</button>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
