<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Bodie Lutz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <!-- Top Navigation Bar -->
  <nav id="navbar">
    <a href="#hero" id="nav-brand">Bodie Lutz</a>
    <div id="nav-links">
      <a href="#about" class="nav-link">About</a>
      <a href="#experience" class="nav-link">Experience</a>
      <a href="#education" class="nav-link">Education</a>
      <a href="./Resume-Website.pdf" target="_blank" class="nav-link">Resume</a>
      <a href="#contact" class="nav-link">Contact</a>
    </div>
    <button id="hamburger-btn" aria-label="Toggle navigation">
      <i class="bi bi-list"></i>
    </button>
  </nav>

  <!-- Mobile dropdown menu -->
  <div id="mobile-menu">
    <a href="#about" class="nav-link">About</a>
    <a href="#experience" class="nav-link">Experience</a>
    <a href="#education" class="nav-link">Education</a>
    <a href="./Resume-Website.pdf" target="_blank" class="nav-link">Resume</a>
    <a href="#contact" class="nav-link">Contact</a>
  </div>

  <!-- Single-page scrollable content -->
  <main id="main-content">

    <!-- Hero -->
    <section id="hero">
      <div class="hero-content">
        <img src="portfolio_picture.JPG" alt="Bodie Lutz" class="hero-pic">
        <div class="hero-text">
          <h1>Bodie Lutz</h1>
          <p id="hero-title">DevOps Engineer</p>
          <p class="hero-tagline">Recent CS grad building cloud infrastructure, scalable systems, and innovative software solutions.</p>
          <div class="hero-actions">
            <button class="hero-cta-primary" onclick="document.querySelector('#about').scrollIntoView({behavior:'smooth'})">View My Work</button>
            <a href="./Resume-Website.pdf" target="_blank">
              <button>View Resume</button>
            </a>
          </div>
          <div class="hero-socials">
            <div id="email-button" class="icon-circle position-relative">
              <a href="mailto:bodielutz@gmail.com">
                <i class="bi bi-envelope icon-envelope default"></i>
                <i class="bi bi-envelope-paper icon-envelope hover"></i>
              </a>
            </div>
            <div class="icon-circle">
              <a href="https://www.linkedin.com/in/bodie-lutz-40ab78293/" target="_blank">
                <i class="bi bi-linkedin icon"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Content sections are loaded from sections/*.html by index.js -->
    <div id="about-mount"></div>
    <div id="experience-mount"></div>
    <div id="education-mount"></div>
    <div id="contact-mount"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>

</body>
</html>
